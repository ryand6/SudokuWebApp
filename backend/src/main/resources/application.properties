# spring.config.import=env.properties
spring.application.name=tomo-sudoku

# React entry point
spa.base-url=${SPA_BASE_URL}

# DB Settings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis Settings
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
#spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=5000
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
# Always keep at least one connection open to prevent latency spikes
spring.data.redis.lettuce.pool.min-idle=1

# Scheduler settings
app.scheduler.pool-size=10

# Used for signing and verifying private lobby token
hmac.lobby.secret-key=${HMAC_LOBBY_SECRET_KEY}
hmac.email.secret-key=${HMAC_EMAIL_SECRET_KEY}

otp.expiry.minutes=10

resend.api-key=${RESEND_API_KEY}
mail.from=${MAIL_FROM:onboarding@resend.dev}

# Flyway owns the schema, Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate

logging.level.root=INFO

# OAuth2 Clients
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile

# Authenticated Session Management
server.servlet.session.timeout=8h
