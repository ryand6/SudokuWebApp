# Test profile. Loaded ON TOP of application.properties when a test class has @ActiveProfiles("test").
# Database settings are not here: the Testcontainers classes inject them while tests run.

spa.base-url=http://localhost:5173

# Fake signing keys. 32 letters/digits so they work whether the code uses them as plain text or Base64.
hmac.lobby.secret-key=TestOnlyLobbyHmacKey0123456789ab
hmac.email.secret-key=TestOnlyEmailHmacKey0123456789ab

resend.api-key=test-only-not-a-real-key

spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.password=

# Fake OAuth logins. The real ones come from environment variables, which tests don't have.
spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test
spring.security.oauth2.client.registration.github.client-id=test
spring.security.oauth2.client.registration.github.client-secret=test
spring.security.oauth2.client.registration.facebook.client-id=test
spring.security.oauth2.client.registration.facebook.client-secret=test
